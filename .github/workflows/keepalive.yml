name: Keep Render awake

on:
  schedule:
    # Every 10 minutes — free Render sleeps after ~15m idle
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "https://bayn-ops-api.onrender.com/up"; then
              echo "ok"
              exit 0
            fi
            sleep 5
          done
          exit 1
